name: 🛡️ DHI CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    # 🚦 Ejecuta una validación completa del repo sobre Linux.
    # Es importante porque reproduce un entorno de CI real para comprobar builds y metadatos.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 📥 Descarga el contenido del repositorio para que el runner pueda construir las imágenes.
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 🏗️ Prepara Buildx para construir imágenes de forma consistente dentro del workflow.
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Autentica contra dhi.io usando secrets del repositorio.
      # Es importante porque las imágenes hardened no se pueden consumir sin login previo.
      - name: 🔐 Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # 📦 Instala ORAS para inspeccionar attestations firmadas en las imágenes DHI.
      - name: 📦 Set up ORAS
        uses: oras-project/setup-oras@v1

      # 🐳 Construye la imagen regular para asegurar que la app base sigue empaquetando correctamente.
      - name: 🐳 Build regular image
        run: docker build -f Dockerfile.regular -t web-regular-ci .

      # 🛡️ Construye la imagen hardened multi-stage para validar la ruta principal de producción.
      - name: 🛡️ Build hardened image
        run: docker build -f Dockerfile.hardened -t web-hardened-ci .

      # 🔥 Construye la variante con Socket Firewall para validar el flujo de instalación protegido.
      - name: 🔥 Build hardened image with Socket Firewall
        run: docker build -f Dockerfile.hardened-sfw -t web-hardened-sfw-ci .

      # 🎯 Resuelve la imagen runtime real desde el Dockerfile hardened (la que realmente estamos usando).
      - name: 🎯 Resolve hardened runtime image
        id: runtime-image
        run: |
          set -euo pipefail
          runtime_image="$(awk '/^FROM / {print $2}' Dockerfile.hardened | tail -n1)"
          if [ -z "$runtime_image" ]; then
            echo "No se pudo resolver la imagen runtime desde Dockerfile.hardened" >&2
            exit 1
          fi

          echo "image=$runtime_image" >> "$GITHUB_OUTPUT"
          echo "Runtime image resolved: $runtime_image"

      # 🧾 Descubre attestations publicadas para la imagen runtime real.
      - name: 🧾 Discover DHI attestations for runtime image
        run: |
          set -euo pipefail
          oras discover "${{ steps.runtime-image.outputs.image }}" --platform linux/amd64 -o json | tee oras-runtime-attestations.json

      # ✅ Valida de forma explícita que existan señales de SBOM y provenance en los metadatos.
      - name: ✅ Validate supply-chain attestations
        run: |
          set -euo pipefail

          if ! jq -e '.manifests and (.manifests | length > 0)' oras-runtime-attestations.json >/dev/null; then
            echo "No se encontraron manifests de attestations para la imagen runtime" >&2
            exit 1
          fi

          if ! jq -e '[.. | strings] | join(" ") | test("sbom|spdx|cyclonedx"; "i")' oras-runtime-attestations.json >/dev/null; then
            echo "No se detectaron señales de SBOM en las attestations" >&2
            exit 1
          fi

          if ! jq -e '[.. | strings] | join(" ") | test("provenance|slsa|in-toto"; "i")' oras-runtime-attestations.json >/dev/null; then
            echo "No se detectaron señales de provenance/in-toto en las attestations" >&2
            exit 1
          fi

          echo "Attestations validadas: se detectaron señales de SBOM y provenance"

      # 📤 Guarda la salida de ORAS como artefacto para revisión posterior en GitHub Actions.
      - name: 📤 Upload ORAS output
        uses: actions/upload-artifact@v4
        with:
          name: oras-runtime-attestations
          path: oras-runtime-attestations.json