version: 2
updates:
  # 🤖 Mantiene el workflow de GitHub Actions alineado con nuevas releases de actions oficiales.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Madrid"
    labels:
      - "🤖 dependencies"
      - "⚙️ github-actions"
    commit-message:
      prefix: "ci"

  # 📦 Mantiene al día las dependencias npm de la app Node y del renderizado EJS.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: "Europe/Madrid"
    labels:
      - "🤖 dependencies"
      - "📦 npm"
    commit-message:
      prefix: "deps"

  # 🐳 Revisa actualizaciones en las imágenes base declaradas en los Dockerfiles del repo.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: "Europe/Madrid"
    labels:
      - "🤖 dependencies"
      - "🐳 docker"
    commit-message:
      prefix: "docker"